<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kick Focus sticker scroll fixture</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; color: #f4f7f5; background: #080a09; }
      #chat-emotes-picker-panel { width: 430px; padding: 12px; border: 1px solid #343a36; background: #101311; }
      #search-emotes-input { width: 100%; margin-bottom: 10px; padding: 9px 11px; color: inherit; border: 1px solid #3b423e; background: #171b19; }
      .picker-scroll { max-height: 720px; overflow-y: auto; overscroll-behavior: contain; }
      .native-tabs { height: 44px; margin-bottom: 4px; border-block: 1px solid #303632; }
      .native-sticker-list { height: 240px; overflow-y: auto; overscroll-behavior: contain; }
      .native-group { margin-top: 16px; }
      .native-group > span { display: block; margin-bottom: 8px; color: #9ca5a0; font-size: 12px; font-weight: 700; }
      .native-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
      .native-grid button { min-height: 46px; border: 1px solid #303632; background: #171b19; }
      .native-grid img { width: 28px; height: 28px; object-fit: contain; }
    </style>
  </head>
  <body>
    <button id="add-late-sticker" type="button" style="position:fixed;top:16px;right:16px">Simulate new sticker</button>
    <button id="fill-quick-favorites" type="button" style="position:fixed;top:48px;right:16px">Fill quick favorites</button>
    <main id="main-container">
      <section id="chat-emotes-picker-panel" aria-label="Sticker picker">
        <div class="picker-scroll overflow-y-auto" data-testid="sticker-scroll">
          <div class="native-shell grid h-full grid-rows-[auto_1fr] gap-1 lg:h-[unset] lg:grid-rows-[unset]" data-testid="native-sticker-shell">
            <input id="search-emotes-input" type="search" placeholder="Search emotes" aria-label="Search emotes">
            <div class="native-tabs" aria-hidden="true"></div>
            <div class="native-sticker-list overflow-y-auto" data-testid="native-sticker-list">
              <div data-testid="native-sticker-groups"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script>
      localStorage.removeItem('kick-focus:settings');
      localStorage.removeItem('kick-focus:sticker-preferences');
      const scroll = document.querySelector('[data-testid="sticker-scroll"]');
      const nativeGroups = document.querySelector('[data-testid="native-sticker-groups"]');
      for (let groupIndex = 0; groupIndex < 3; groupIndex += 1) {
        const section = document.createElement('section');
        section.className = 'native-group';
        const label = document.createElement('span');
        label.id = `emote-picker-section-name-Group-${groupIndex + 1}`;
        label.textContent = `Group ${groupIndex + 1}`;
        const grid = document.createElement('div');
        grid.className = 'native-grid';
        for (let offset = 0; offset < 48; offset += 1) {
          const index = groupIndex * 48 + offset + 1;
          const button = document.createElement('button');
          button.type = 'button';
          button.dataset.emoteId = String(9000 + index);
          button.setAttribute('aria-label', `Sticker ${index}`);
          if (index === 121) button.disabled = true;
          const image = document.createElement('img');
          image.src = `/dist/extension/icons/icon-32.png?fixture=/emotes/${index}`;
          image.alt = `Sticker ${index}`;
          button.append(image);
          grid.append(button);
        }
        section.append(label, grid);
        nativeGroups.append(section);
      }
      document.getElementById('add-late-sticker').addEventListener('click', () => {
        if (document.querySelector('[data-emote-id="99999"]')) return;
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.emoteId = '99999';
        button.setAttribute('aria-label', 'Sticker 145');
        const image = document.createElement('img');
        image.src = '/dist/extension/icons/icon-32.png?fixture=/emotes/145';
        image.alt = 'Sticker 145';
        button.append(image);
        nativeGroups.querySelector('.native-grid:last-of-type')?.append(button);
      });
      document.getElementById('fill-quick-favorites').addEventListener('click', async () => {
        for (let index = 1; index <= 24; index += 1) {
          for (let attempt = 0; attempt < 20; attempt += 1) {
            const candidate = [...document.querySelectorAll('[data-kf-sticker-action="pin"]')]
              .find((button) => button.getAttribute('aria-label') === `Favorite Emote ${index}`);
            if (candidate) {
              candidate.click();
              break;
            }
            await new Promise((resolve) => setTimeout(resolve, 20));
          }
          await new Promise((resolve) => setTimeout(resolve, 30));
        }
      });
    </script>
    <script src="/dist/kick-focus.user.js"></script>
  </body>
</html>
