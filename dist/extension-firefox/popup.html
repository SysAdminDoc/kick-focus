<!doctype html>
<html lang="en" dir="ltr" data-theme="studio">
<head>
<meta charset="utf-8">
<title data-i18n="extensionName">Kick Focus</title>
<style>
  :root {
    color-scheme: dark;
    --surface-base: #090d0a;
    --surface-high: #121814;
    --surface-low: #070a08;
    --surface-hover: #202a23;
    --text: #f5f8f6;
    --text-secondary: #cbd3ce;
    --text-muted: #a4afa7;
    --accent: #7cff2b;
    --accent-rgb: 124, 255, 43;
    --on-accent: #071004;
    --border: #2c382f;
    --border-control: #46564b;
    --radius: 8px;
  }
  :root[data-theme="oled"] {
    --surface-base: #000;
    --surface-high: #080a09;
    --surface-low: #030404;
    --surface-hover: #111613;
    --text: #f8faf9;
    --text-secondary: #d2d7d4;
    --text-muted: #a9b0ac;
    --border: #191f1b;
    --border-control: #38423c;
  }
  :root[data-theme="slate"] {
    --surface-base: #090e13;
    --surface-high: #151f28;
    --surface-low: #0f161d;
    --surface-hover: #263544;
    --text: #f3f7fa;
    --text-secondary: #cbd6df;
    --text-muted: #a6b5c2;
    --border: #253541;
    --border-control: #496072;
  }
  * { box-sizing: border-box; }
  body {
    width: 360px;
    margin: 0;
    padding: 18px;
    background: radial-gradient(circle at 15% -8%, rgba(var(--accent-rgb),.1), transparent 32%), var(--surface-base);
    color: var(--text);
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .brand img { width: 32px; height: 32px; object-fit: contain; }
  .brand-copy { display: grid; gap: 1px; }
  h1 { font-size: 16px; margin: 0; letter-spacing: -0.025em; }
  .eyebrow { color: var(--accent); font-size: 9px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
  .version { color: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .card {
    position: relative;
    overflow: hidden;
    background: linear-gradient(145deg, var(--surface-high), var(--surface-low));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 13px;
    margin-bottom: 11px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
  }
  .card:first-of-type::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 2px; background: var(--accent); opacity: .75; }
  .status { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 10px; }
  .state { min-width: 58px; padding: 5px 7px; border: 1px solid var(--accent); border-radius: 4px; color: var(--accent); font-size: 9px; font-weight: 850; letter-spacing: .08em; text-align: center; text-transform: uppercase; }
  .state[data-state="off"] { border-color: var(--border-control); color: var(--text-muted); }
  .status-text strong { display: block; font-size: 13px; font-weight: 600; }
  .status-text span { color: var(--text-muted); font-size: 11px; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .stat { min-width: 0; background: var(--surface-low); border: 1px solid var(--border); border-radius: 6px; padding: 10px 11px; }
  .stat span { display: block; color: var(--text-muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
  .stat strong { font-size: 17px; font-variant-numeric: tabular-nums; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .row p { margin: 2px 0 0; color: var(--text-muted); font-size: 11px; }
  .row label { font-weight: 500; }
  .feed-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .feed-head strong { font-weight: 650; }
  .feed-head span { color: var(--text-muted); font-size: 10px; }
  .feed-url { overflow: hidden; margin: 5px 0 10px; color: var(--text-muted); font: 10px/1.45 ui-monospace, "SFMono-Regular", Consolas, monospace; text-overflow: ellipsis; white-space: nowrap; }
  .feed-actions { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px; }
  .feed-actions button { min-height: 34px; padding-block: 6px; }
  .feed-actions .quiet { width: auto; color: var(--text-secondary); }
  input[type="checkbox"] { accent-color: var(--accent); width: 18px; height: 18px; flex: none; cursor: pointer; }
  button {
    width: 100%;
    min-height: 44px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface-high);
    color: var(--text);
    font: inherit;
    font-weight: 700;
    cursor: pointer;
    transition: border-color 150ms ease, background-color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: 0 10px 26px rgba(var(--accent-rgb),.12); }
  button:hover { border-color: var(--border-control); background: var(--surface-hover); transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0,0,0,.2); }
  button.primary:hover { border-color: var(--accent); background: var(--accent); filter: brightness(1.08); }
  button:active { transform: translateY(0); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; filter: none; transform: none; }
  button.primary:disabled { background: var(--surface-hover); border-color: var(--border); color: var(--text-muted); box-shadow: none; }
  .note { color: var(--text-muted); font-size: 11px; margin: 11px 2px 0; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .001ms !important; } }
</style>
</head>
<body aria-busy="true">
  <header>
    <div class="brand"><img src="icons/icon-32.png" alt=""><div class="brand-copy"><span class="eyebrow" data-i18n="companionLabel">Companion</span><h1 data-i18n="extensionName">Kick Focus</h1></div></div>
    <span class="version" id="version"></span>
  </header>

  <div class="card" role="status">
    <div class="status">
      <span class="state" id="network-state" data-state="off" data-i18n="checkingState">Checking</span>
      <span class="status-text">
        <strong id="network-title" data-i18n="checkingCompanion">Checking companion</strong>
        <span id="network-detail" data-i18n="readingNetwork">Reading the network layer state.</span>
      </span>
    </div>
  </div>

  <div class="card stats" role="status">
    <div class="stat"><span data-i18n="blockedLabel">Blocked</span><strong id="blocked" data-i18n="unavailableValue">Not available</strong></div>
    <div class="stat"><span data-i18n="rulesetsLabel">Rulesets</span><strong id="rulesets" data-i18n="unavailableValue">Not available</strong></div>
  </div>

  <div class="card">
    <div class="row">
      <span>
        <label for="telemetry" data-i18n="reduceTelemetryLabel">Reduce tracking telemetry</label>
        <p data-i18n="reduceTelemetryDescription">Also blocks video and error telemetry hosts.</p>
      </span>
      <input type="checkbox" id="telemetry" disabled title="Checking the network layer" data-i18n-title="checkingNetworkTitle">
    </div>
  </div>

  <div class="card">
    <div class="feed-head">
      <strong data-i18n="remoteBlocklistLabel">Remote blocklist</strong>
      <span id="blocklist-state" data-i18n="checkingState">Checking</span>
    </div>
    <p class="feed-url" id="blocklist-url" data-i18n="readingConfiguredFeed">Reading the configured feed.</p>
    <div class="feed-actions">
      <button id="approve-blocklist" disabled data-i18n="approveFeedButton">Approve this feed</button>
      <button class="quiet" id="revoke-blocklist" hidden data-i18n="removeButton">Remove</button>
    </div>
  </div>

  <button class="primary" id="open-settings" disabled title="Checking for an active Kick tab" data-i18n="openSettingsButton" data-i18n-title="checkingKickTitle">Open Kick Focus settings</button>
  <p class="note" id="note" aria-live="polite" data-i18n="checkingCurrentTab">Checking the current Kick tab…</p>

  <script src="popup.js"></script>
</body>
</html>
